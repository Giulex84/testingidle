<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Idle Realm Metrics</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#f6f2e8;font:16px system-ui}.wrap{max-width:980px;margin:auto;padding:28px 16px}.hero{display:flex;align-items:center;gap:15px}.badge{margin-left:auto;color:#f4c95d;border:1px solid #8a6b2f;border-radius:99px;padding:8px 12px}.panel{margin-top:22px;padding:22px;background:#111827;border:1px solid #26334d;border-radius:20px}.toolbar{display:flex;justify-content:space-between;gap:12px}select,button{background:#172238;color:#fff;border:1px solid #34435f;border-radius:12px;padding:13px 16px;font:inherit}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{background:#0d1423;border:1px solid #26334d;border-radius:16px;padding:17px;color:#99a5bb}.card b{display:block;color:#fff;font-size:32px;margin-top:7px}.table{overflow:auto;margin-top:20px}table{width:100%;min-width:740px;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #26334d;text-align:right}th:first-child,td:first-child{text-align:left}.hidden{display:none}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="hero"><div style="font-size:42px">📊</div><div><h1 style="margin:0">Idle Realm Metrics</h1><div style="color:#99a5bb">Testnet · private aggregate telemetry</div></div><span class="badge">ADMIN</span></div><section id="login" class="panel"><h2>Owner access</h2><p>Authenticate with Pi to view metrics.</p><button id="verify">VERIFY WITH PI</button></section><section id="dash" class="panel hidden"><div class="toolbar"><select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select><button id="refresh">Refresh</button></div><p id="status"></p><div class="cards"><div class="card">DAILY UNIQUES (SUM)<b id="users">0</b></div><div class="card">LOGINS<b id="logins">0</b></div><div class="card">GAME ACTIONS<b id="actions">0</b></div><div class="card">ERAS ADVANCED<b id="eras">0</b></div><div class="card">BOOST SALES<b id="boosts">0</b></div><div class="card">REWARDS SENT<b id="rewards">0</b></div></div><div class="table"><table><thead><tr><th>UTC day</th><th>Users</th><th>Logins</th><th>Actions</th><th>Eras</th><th>Boosts</th><th>Rewards</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>Pi.init({version:"2.0",sandbox:true});let token="";const $=id=>document.getElementById(id),sum=(r,k)=>r.reduce((n,x)=>n+Number(x.events?.[k]||0),0);async function load(){try{const r=await fetch("/api/metrics?days="+$("days").value,{headers:{Authorization:"Bearer "+token},cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Metrics failed");const rows=d.rows||[];$("users").textContent=rows.reduce((n,x)=>n+Number(x.uniqueUsers||0),0);$("logins").textContent=sum(rows,"login");$("actions").textContent=sum(rows,"game_action");$("eras").textContent=sum(rows,"era_advanced");$("boosts").textContent=sum(rows,"boost_purchased");$("rewards").textContent=sum(rows,"reward_sent");$("rows").innerHTML=rows.map(x=>`<tr><td>${x.day}</td><td>${x.uniqueUsers||0}</td><td>${x.events?.login||0}</td><td>${x.events?.game_action||0}</td><td>${x.events?.era_advanced||0}</td><td>${x.events?.boost_purchased||0}</td><td>${x.events?.reward_sent||0}</td></tr>`).join("");$("status").textContent="Updated "+new Date(d.generatedAt).toLocaleString()}catch(e){$("status").textContent=e.message}}$("verify").onclick=async()=>{try{const a=await Pi.authenticate(["username"],()=>{});token=a.accessToken;$("login").classList.add("hidden");$("dash").classList.remove("hidden");await load()}catch(e){alert(e.message||"Pi authentication failed")}};$("refresh").onclick=load;$("days").onchange=load;</script></body></html>
